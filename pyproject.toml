[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger-agent"
version = "0.1.0"
description = "An AI bookkeeper for messy bank statements: import, categorize, learn, reconcile, answer."
requires-python = ">=3.10"
dependencies = [
    "openai>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
ledger = "ledger_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# the web UI, built by `npm run build` in ui/ (see ui/README or the Dockerfile)
ledger_agent = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# pinned explicitly so a new ruff release with wider defaults can't break CI
select = ["E4", "E7", "E9", "F"]
